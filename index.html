<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KkSaiko Modded</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #e5e5e5;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    img {
      width: 100%;
      border-radius: 8px;
      display: block;
      margin-bottom: 32px;
      border: 1px solid #222;
    }

    h1 {
      font-family: 'Bungee', sans-serif;
      font-size: clamp(1.9rem, 5.5vw, 2.8rem);
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .sub {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 48px;
      letter-spacing: 1px;
    }

    .timer {
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    .block {
      min-width: 72px;
    }

    .num {
      font-family: 'Bungee', sans-serif;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      color: #fff;
      line-height: 1;
    }

    .label {
      font-size: 0.72rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      .timer {
        gap: 16px;
      }
      .block {
        min-width: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://tr.rbxcdn.com/180DAY-942f70f9671ca17af4441d3aa1598acd/768/432/Image/Png/noFilter" alt="KkSaiko Modded">
    
    <h1>KkSaiko Modded</h1>
    <div class="sub">new experience</div>

    <div class="timer">
      <div class="block">
        <div class="num" id="d">0</div>
        <div class="label">days</div>
      </div>
      <div class="block">
        <div class="num" id="h">00</div>
        <div class="label">hours</div>
      </div>
      <div class="block">
        <div class="num" id="m">00</div>
        <div class="label">min</div>
      </div>
      <div class="block">
        <div class="num" id="s">00</div>
        <div class="label">sec</div>
      </div>
    </div>
  </div>

  <script>
    const end = 1794088800 * 1000;

    function tick() {
      const now = Date.now();
      let t = Math.max(0, end - now);

      const d = Math.floor(t / 86400000);
      t %= 86400000;
      const h = Math.floor(t / 3600000);
      t %= 3600000;
      const m = Math.floor(t / 60000);
      t %= 60000;
      const s = Math.floor(t / 1000);

      document.getElementById('d').textContent = d;
      document.getElementById('h').textContent = String(h).padStart(2, '0');
      document.getElementById('m').textContent = String(m).padStart(2, '0');
      document.getElementById('s').textContent = String(s).padStart(2, '0');
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
